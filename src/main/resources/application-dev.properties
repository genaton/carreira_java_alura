spring.application.name=reserva

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/migration
spring.docker.compose.enabled=false



# Dialeto correto para as versões estáveis do MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-on-validation-error=false

# Exibição e formatação de SQL no console para análise de performance e N+1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.delayed_drop=true

# Garante o registro correto de parâmetros passados nas consultas (útil para debugar conflitos de datas)
logging.level.org.hibernate.orm.jdbc.bind=trace